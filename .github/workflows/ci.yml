name: Application checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: stylefit
          POSTGRES_PASSWORD: ci-fixture-only
          POSTGRES_DB: stylefit_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U stylefit -d stylefit_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      mailpit:
        image: axllent/mailpit:v1.34.0
        ports:
          - 1025:1025
          - 8025:8025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check:budget
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run test:account
        env:
          STYLEFIT_TEST_DATABASE_URL: postgresql://stylefit:ci-fixture-only@127.0.0.1:55432/stylefit_test
          BETTER_AUTH_SECRET: stylefit-fixed-secret-for-ci-fixtures-only
          SMTP_HOST: 127.0.0.1
          SMTP_PORT: "1025"
          SMTP_FROM: StyleFit AI <no-reply@example.test>
